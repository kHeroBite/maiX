<!-- WebView2에서 Markmap 마인드맵을 렌더링하는 셸 HTML -->
<!DOCTYPE html>
<html lang="ko" class="markmap-dark">
<head>
<meta charset="UTF-8">
<title>MindMap</title>
<style>
  :root {
    --bg-color: #1e1e1e;
    --text-color: #f0f0f0;
    --line-color: #888;
    --link-color: #4ec9b0;
    --close-bg: rgba(0, 0, 0, 0.5);
    --close-fg: #ffffff;
    --close-hover-bg: rgba(255, 50, 50, 0.8);
  }
  html.theme-light {
    --bg-color: #ffffff;
    --text-color: #1e1e1e;
    --line-color: #aaa;
    --link-color: #007acc;
    --close-bg: rgba(255, 255, 255, 0.7);
    --close-fg: #1e1e1e;
    --close-hover-bg: rgba(255, 50, 50, 0.8);
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-color); }
  #mindmap { width: 100vw; height: 100vh; }
  /* Markmap 노드 색상 — 라이트/다크 자동 */
  /* foreignObject 안의 div가 노드 텍스트의 실제 렌더 컨테이너 */
  .markmap-foreign { color: var(--text-color) !important; }
  .markmap-foreign div { color: var(--text-color) !important; }
  .markmap-link { stroke: var(--line-color); }
  /* X 닫기 버튼 — 우상단 고정 */
  #closeBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--close-bg);
    color: var(--close-fg);
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    z-index: 9999;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #closeBtn:hover {
    background: var(--close-hover-bg);
  }
  /* SVG 마인드맵 — 클릭 이벤트 허용 (closeBtn 가로채기 방지) */
  #mindmap svg { pointer-events: auto; }
</style>
</head>
<body>
<!-- 우상단 X 닫기 버튼 (WebView2 HWND 위로 항상 표시) -->
<button id="closeBtn" type="button" aria-label="마인드맵 닫기" title="닫기 (ESC)">×</button>
<svg id="mindmap"></svg>
<script src="markmap-d3.js"></script>
<script src="markmap-view.js"></script>
<script src="markmap-lib.js"></script>
<script>
  // 외부에서 호출 가능한 전역 함수
  let markmapInstance = null;
  let transformer = null;

  function initMarkmap() {
    try {
      transformer = new markmap.Transformer();
      const svgEl = document.querySelector('#mindmap');
      markmapInstance = markmap.Markmap.create(svgEl);
      console.log('Markmap initialized');
    } catch (e) {
      console.error('Markmap init failed:', e);
    }
  }

  // 외부(C#)에서 호출하는 진입점 — markdown 문자열 받아 렌더
  window.renderMindMap = function(markdownStr) {
    try {
      if (!markmapInstance) initMarkmap();
      const { root } = transformer.transform(markdownStr);
      markmapInstance.setData(root);
      markmapInstance.fit();
      return 'OK';
    } catch (e) {
      console.error('renderMindMap failed:', e);
      return 'ERROR: ' + e.message;
    }
  };

  // 테마 전환 함수 — C#에서 ExecuteScriptAsync('window.setTheme("light")')로 호출
  window.setTheme = function(mode) {
    try {
      if (mode === 'light') {
        document.documentElement.classList.add('theme-light');
        document.documentElement.classList.remove('markmap-dark');
      } else {
        document.documentElement.classList.remove('theme-light');
        document.documentElement.classList.add('markmap-dark');
      }
      console.log('Theme applied:', mode);
      // 마인드맵 재렌더 (스타일 갱신 보장)
      if (typeof markmapInstance !== 'undefined' && markmapInstance) {
        try { markmapInstance.fit(); } catch (e) {}
      }
      return 'OK';
    } catch (e) {
      console.error('setTheme failed:', e);
      return 'ERROR: ' + e.message;
    }
  };

  // X 버튼 클릭 → C#에 close 메시지 전달 (pointer-events:auto + stopPropagation)
  document.getElementById('closeBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    console.log('[MMR3] closeBtn clicked (pointer-events:auto)');
    try {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage('close');
        console.log('[MMR3] postMessage(close) sent');
      } else {
        console.warn('[MMR3] window.chrome.webview unavailable');
      }
    } catch (err) { console.error('[MMR3] postMessage failed:', err); }
  });

  // ESC 키 → C#에 close 메시지 전달 (이중 안전망)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      try {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage('close');
        }
      } catch (err) {}
    }
  });

  // 초기화 — 안내 텍스트 setData 제거 (C# Bind 시 첫 renderMindMap 호출에서 데이터 주입)
  document.addEventListener('DOMContentLoaded', () => {
    console.log('[MMR3] closeBtn DOMContentLoaded — pointer-events:auto 적용');
    initMarkmap();
    // [MMF-실행] 초기 안내 setData 제거 — C# Bind 시 첫 renderMindMap 호출에서 데이터 주입
  });
</script>
</body>
</html>
